        const [copied, setCopied] = useState(null);

        const handleCopy = (text, id) => {
          navigator.clipboard.writeText(text);
          setCopied(id);
          setTimeout(() => setCopied(null), 2000);
        };

        const handleDownload = () => {
          const content = ` ООО «ЭЛЬБРУС» - КАРТОЧКА ПРЕДПРИЯТИЯ\n------------------------------\nИНН: ${requisites.inn}\nКПП: ${requisites.kpp}\nОГРН: ${requisites.ogrn}\nАдрес: ${requisites.address}\nДиректор: ${requisites.director}`;
          const b = new Blob([content], { type: 'text/plain;charset=utf-8' });
          const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `Requisites_Elbrus.txt`; l.click();
        };

        const items = [
          { label: 'Краткое наименование', value: requisites.name, copy: true, id: 'sh' },
          { label: 'Полное наименование', value: requisites.fullName, copy: true, id: 'fl' },
          { label: 'ИНН', value: requisites.inn, copy: true, code: true, id: 'in' },
          { label: 'КПП', value: requisites.kpp, copy: true, code: true, id: 'kp' },
          { label: 'ОГРН', value: requisites.ogrn, copy: true, code: true, id: 'og' },
          { label: 'Юридический адрес', value: requisites.address, copy: true, id: 'ad' },
          { label: 'Руководитель', value: `${requisites.director} (Директор)`, id: 'dr' },
        ];

        return (
          <section className="py-20 bg-white" id="requisites">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="mb-12">
                <span className="text-emerald-600 font-mono text-[10px] font-bold tracking-widest block mb-1">05 / ДАННЫЕ</span>
                <h2 className="text-2xl sm:text-3xl font-black text-gray-950">Реквизиты и учредительные данные</h2>
                <div className="w-12 h-1 bg-emerald-600 mt-2 rounded-full"></div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                <div className="lg:col-span-4 space-y-4">
                  <div className="bg-slate-50 border border-slate-100 p-5 rounded-xl relative overflow-hidden">
                    <span className="inline-flex items-center space-x-1 px-2.5 py-1 bg-emerald-100/60 text-emerald-800 text-[9px] font-bold uppercase rounded-md mb-4">
                      <Icon name="shieldCheck" className="w-3 h-3 text-emerald-600" />
                      <span>Статус: Активный</span>
                    </span>
                    <h3 className="text-base font-black text-gray-900 leading-tight mb-2">Действующее юридическое лицо</h3>
                    <p className="text-xs text-gray-450 leading-relaxed">Компания ООО «ЭЛЬБРУС» зарегистрирована в ИФНС и работает строго на прозрачных сметных и законодательных условиях.</p>
                  </div>
                  <button onClick={handleDownload} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase py-3.5 rounded-lg flex items-center justify-center space-x-2">
                    <Icon name="download" className="w-3.5 h-3.5" />
                    <span>СКАЧАТЬ КАРТОЧКУ ООО</span>
                  </button>
                </div>

                <div className="lg:col-span-8 bg-slate-50/50 border border-slate-200/50 rounded-xl p-5 sm:p-6 space-y-3">
                  <div className="grid grid-cols-1 divide-y divide-slate-100">
                    {items.map((it) => (
                      <div key={it.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                        <span className="sm:w-1/3 text-xs text-gray-450 font-bold">{it.label}</span>
                        <div className="sm:w-2/3 flex items-center justify-between gap-2.5">
                          <span className={`text-xs text-gray-950 leading-relaxed font-semibold ${it.code ? 'font-mono text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100/10' : ''}`}>{it.value}</span>
                          {it.copy && (
                            <button onClick={() => handleCopy(it.value, it.id)} className="p-1.5 text-gray-400 hover:text-emerald-600 bg-white border border-slate-100 rounded-md">
                              {copied === it.id ? <Icon name="check" className="w-3 h-3 text-emerald-600" /> : <Icon name="copy" className="w-3 h-3" />}
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // 8. CALLBACK FORM
      function CallbackForm({ preFilledVacancy, onClosePreFill }) {
        const [name, setName] = useState('');
        const [phone, setPhone] = useState('');
        const [interest, setInterest] = useState(preFilledVacancy ? 'карьера' : 'дорожное');
        const [comment, setComment] = useState('');
        const [agree, setAgree] = useState(true);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [status, setStatus] = useState('idle');
        const [err, setErr] = useState('');

        useEffect(() => {
          if (preFilledVacancy) setInterest('карьера');
        }, [preFilledVacancy]);

        const handleSend = (e) => {
          e.preventDefault();
          setErr('');
          if (!name.trim()) return setErr('Введите ваше имя');
          if (phone.replace(/\D/g, '').length < 10) return setErr('Введите корректный номер телефона');
          if (!agree) return setErr('Дайте согласие на конфиденциальность');

          setIsSubmitting(true);
          setTimeout(() => {
            setIsSubmitting(false);
            setStatus('success');
            setName(''); setPhone(''); setComment('');
            if (onClosePreFill) onClosePreFill();
          }, 1000);
        };

        return (
          <section className="py-20 bg-slate-50 border-t border-slate-100 relative overflow-hidden" id="contacts">
            <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
                <div className="lg:col-span-6 space-y-4">
                  <span className="text-emerald-600 font-mono text-[10px] font-bold uppercase tracking-widest block">СВЯЗАТЬСЯ С НАМИ</span>
                  <h2 className="text-2xl sm:text-3xl font-black text-gray-950 leading-tight">Оставьте быструю заявку</h2>
                  <p className="text-xs sm:text-sm text-gray-600 leading-relaxed max-w-md">Обсудим задачу и предложим индивидуальные ценовые и технические условия. Оперативно перезвоним по указанному номеру.</p>
                  <div className="space-y-2 pt-4 border-t border-slate-200 text-xs text-gray-500">
                    <div className="flex items-center space-x-2.5">
                      <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></div>
                      <span>Оперативно перезваниваем в течение 10-15 минут</span>
                    </div>
                    <div className="flex items-center space-x-2.5">
                      <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></div>
                      <span>Бесплатный расчет сметы дорожно-строительных работ</span>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6 bg-white border border-slate-200/55 rounded-xl p-6 sm:p-8 shadow-sm">
                  {status === 'success' ? (
                    <div className="text-center py-6 space-y-3 animate-fade-in">
                      <div className="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 mx-auto border border-emerald-100">
                        <Icon name="checkCircle" className="w-7 h-7" />
                      </div>
                      <h3 className="text-sm font-black text-gray-950">Заявка успешно отправлена!</h3>
                      <p className="text-xs text-gray-500">Наши ответственные специалисты свяжутся с вами в ближайшее рабочее время.</p>
                      <button onClick={() => setStatus('idle')} className="text-xs font-bold text-emerald-600 underline uppercase tracking-wider">Назад к форме</button>
                    </div>
                  ) : (
                    <form onSubmit={handleSend} className="space-y-4">
                      {err && (
                        <div className="bg-red-50 text-red-700 text-xs p-3 rounded border border-red-100 flex items-center space-x-2 animate-shake">
                          <Icon name="shieldAlert" className="w-4 h-4 text-red-600 shrink-0" />
                          <span>{err}</span>
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] font-bold text-gray-400 uppercase font-mono block mb-1.5">Ваше представительское имя *</label>
                        <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Александр Самедович" className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 text-xs rounded-lg focus:bg-white focus:border-emerald-600 outline-none" required />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] font-bold text-gray-400 uppercase font-mono block mb-1.5">Номер телефона для связи *</label>
                          <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+7 (999) 000-00-00" className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 text-xs rounded-lg focus:bg-white focus:border-emerald-600 outline-none" required />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-gray-400 uppercase font-mono block mb-1.5">Предмет обсуждения</label>
                          <select value={interest} onChange={(e) => setInterest(e.target.value)} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs rounded-lg focus:bg-white focus:border-emerald-600 outline-none">
                            <option value="дорожное">Строительство дорог / Асфальт</option>
                            <option value="земляные">Разработка котлованов</option>
                            <option value="благоустройство">Благоустройство территорий</option>
                            <option value="карьера">Трудоустройство / Вакансии</option>
                          </select>
                        </div>
                      </div>

                      {preFilledVacancy && (
                        <div className="bg-emerald-50/60 p-3 rounded-lg border border-emerald-100 flex items-center justify-between gap-2">
                          <span className="text-[11px] text-emerald-800 font-bold uppercase truncate">Отклик на: "{preFilledVacancy}"</span>
                          <button type="button" onClick={onClosePreFill} className="text-emerald-700 hover:text-emerald-900 text-xs">×</button>
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] font-bold text-gray-400 uppercase font-mono block mb-1.5">Сообщение или важные детали</label>
                        <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Укажите объемы, сроки или ваши профессиональные навыки..." className="w-full h-16 px-3.5 py-2.5 bg-slate-50 border border-slate-200 text-xs rounded-lg focus:bg-white focus:border-emerald-600 outline-none resize-none" />
                      </div>

                      <div className="flex items-start space-x-2.5">
                        <input id="agree-cb" type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} className="mt-0.5 rounded text-emerald-650 cursor-pointer" />
                        <label htmlFor="agree-cb" className="text-[10px] text-gray-450 leading-relaxed cursor-pointer select-none">
                          Я полностью соглашаюсь с государственными СНиП, обработкой персональных данных и условиями конфиденциальности уполномоченного лица.
                        </label>
                      </div>

                      <button type="submit" disabled={isSubmitting} className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-400 text-white font-bold text-xs uppercase tracking-wider py-3 rounded-lg transition-all shadow-sm flex items-center justify-center space-x-2">
                        {isSubmitting ? (
                          <span>ОТПРАВКА...</span>
                        ) : (
                          <>
                            <Icon name="send" className="w-4 h-4 cursor-pointer" />
                            <span>ОТПРАВИТЬ ЗАЯВКУ</span>
                          </>
                        )}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </section>
        );
      }

      // 9. FOOTER
      function Footer({ onPrivacyOpen }) {
        const handleScrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        return (
          <footer className="bg-gray-950 text-gray-400 text-xs pt-16 pb-8 border-t border-gray-900" id="contacts">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 pb-12 border-b border-gray-900">
                <div className="space-y-4">
                  <div className="flex items-center space-x-2.5">
                    <div className="relative w-9 h-9 bg-emerald-600 rounded flex items-center justify-center overflow-hidden">
                      <div className="absolute inset-0 flex flex-col justify-end items-center pb-0.5">
                        <div className="w-0.5 h-4 bg-white/20 absolute bottom-0.5 left-1/2 -translate-x-[6px] rotate-12"></div>
                        <div className="w-0.5 h-4 bg-white/40 absolute bottom-0.5 left-1/2 -translate-x-1/2 rotate-12"></div>
                        <div className="w-0.5 h-4 bg-white/20 absolute bottom-0.5 left-1/2 translate-x-[3px] rotate-12"></div>
                        <div className="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[18px] border-b-white/90 relative z-10">
                          <div className="absolute top-[6px] left-[0.5px] -translate-x-1/2 w-0.5 h-2 bg-emerald-600 transform rotate-[15deg]"></div>
                        </div>
                      </div>
                    </div>
                    <span className="text-base font-black text-white"><span className="text-emerald-500">ЭЛЬ</span>БРУС</span>
                  </div>
                  <p className="text-[11px] text-gray-500 leading-relaxed">Строим надежную дорожную инфраструктуру, строго следуя СНиП, ГОСТ и индивидуальным сметным интересам наших заказчиков.</p>
                </div>

                <div>
                  <h4 className="text-[10px] font-bold text-white uppercase tracking-widest mb-4 font-mono">Навигация</h4>
                  <ul className="space-y-2.5">
                    {[['about', 'О компании'], ['objects', 'Выполненные объекты'], ['news', 'Новости'], ['vacancies', 'Вакансии']].map(([id, nm]) => (
                      <li key={id}><a href={`#${id}`} className="hover:text-emerald-400">{nm}</a></li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h4 className="text-[10px] font-bold text-white uppercase tracking-widest mb-4 font-mono">Контакты</h4>
                  <ul className="space-y-2.5 text-[11px]">
                    <li className="flex items-center space-x-2"><Icon name="phone" className="w-4 h-4 text-emerald-500 shrink-0" /><a href="tel:+73522411010" className="hover:text-emerald-400">+7 (3522) 41-10-10</a></li>
                    <li className="flex items-center space-x-2"><Icon name="mail" className="w-4 h-4 text-emerald-500 shrink-0" /><a href="mailto:info@elbrus45.ru" className="hover:text-emerald-400">info@elbrus45.ru</a></li>
                    <li className="flex items-start space-x-2"><span className="text-emerald-500 font-bold mt-0.5 shrink-0">📍</span><span>г. Курган, ул. Савельева, дом 58</span></li>
                  </ul>
                </div>

                <div className="flex flex-col justify-between">
                  <div>
                    <h4 className="text-[10px] font-bold text-white uppercase tracking-widest mb-4 font-mono">Социальные сети</h4>
                    <div className="flex space-x-3 mb-6">
                      <a href="https://vk.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded bg-gray-900 border border-gray-800 hover:border-emerald-500 flex items-center justify-center hover:text-emerald-400 font-bold text-xs">VK</a>
                      <a href="https://t.me" target="_blank" rel="noreferrer" className="w-8 h-8 rounded bg-gray-900 border border-gray-800 hover:border-emerald-500 flex items-center justify-center hover:text-emerald-400 font-bold text-xs">TG</a>
                    </div>
                  </div>
                  <button onClick={handleScrollTop} className="flex items-center space-x-1.5 font-bold uppercase text-[10px] text-emerald-500">
                    <Icon name="arrowUp" className="w-4 h-4" />
                    <span>НАВЕРХ</span>
                  </button>
                </div>
              </div>

              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-gray-550 text-[10px] font-mono leading-none">
                <span>© {new Date().getFullYear()} ООО «ЭЛЬБРУС». Все права защищены.</span>
                <button onClick={onPrivacyOpen} className="hover:text-emerald-400 underline">Политика конфиденциальности</button>
              </div>
            </div>
          </footer>
        );
      }

      // ==========================================
      // ROOT APP CORE
      // ==========================================
      function App() {
        const [activeSection, setActiveSection] = useState('hero');
        const [preFilledVacancy, setPreFilledVacancy] = useState(null);
        const [isPrivacyOpen, setIsPrivacyOpen] = useState(false);

        const handleOpenApply = (vacancyTitle) => {
          setPreFilledVacancy(vacancyTitle);
          const element = document.getElementById('contacts');
          if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        const handleOpenCallbackOnly = () => {
          setPreFilledVacancy(null);
          const element = document.getElementById('contacts');
          if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        return (
          <div className="min-h-screen flex flex-col justify-between overflow-x-hidden relative" id="main-application-runner">
            <Header activeSection={activeSection} setActiveSection={setActiveSection} onOpenCallback={handleOpenCallbackOnly} />
            
            <main className="flex-grow">
              <Hero onLearnMoreClick={() => {
                setActiveSection('objects');
                const pEl = document.getElementById('objects');
                if (pEl) pEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }} onOpenCallback={handleOpenCallbackOnly} />
              <About />
              <Objects />
              <News />
              <Vacancies onOpenApply={handleOpenApply} />
              <RequisiteCard />
              <CallbackForm preFilledVacancy={preFilledVacancy} onClosePreFill={() => setPreFilledVacancy(null)} />
            </main>

            <Footer onPrivacyOpen={() => setIsPrivacyOpen(true)} />

            {/* Privacy Policy Modal */}
            {isPrivacyOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white w-full max-w-lg rounded-xl overflow-hidden shadow-2xl relative border border-slate-100 flex flex-col max-h-[80vh] animate-fade-in">
                  <button onClick={() => setIsPrivacyOpen(false)} className="absolute top-3 right-3 p-1.5 bg-slate-100 text-gray-500 hover:text-gray-800 rounded-full">
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                  <div className="p-6 overflow-y-auto">
                    <h3 className="text-base font-black text-gray-950 mb-4 tracking-tight">Политика обработки персональных данных</h3>
                    <div className="text-xs text-gray-650 space-y-3.5 leading-relaxed">
                      <p>ООО «ЭЛЬБРУС» (Курганская область) собирает ваши персональные данные (Имя, Телефон), указанные при добровольном заполнении форм обратной связи и откликах на открытые вакансии.</p>
                      <p>Мы гарантируем сохранность ваших данных в соответствии со статьей 152-ФЗ Российской Федерации, не передаем и не даём доступ третьим лицам без вашего прямого законного согласия.</p>
                      <p>Используемая информация берется исключительно для связи оператора и согласования технических смет, закупки асфальта, разработки грунта или урегулирования трудовых договоров.</p>
                    </div>
                  </div>
                  <div className="bg-slate-50 px-6 py-3.5 border-t border-slate-100 flex justify-end">
                    <button onClick={() => setIsPrivacyOpen(false)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-lg">Понятно</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Render App
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
